name: Publicar versão

# Ao criar uma tag v* (ex.: git tag v1.2.0 && git push --tags), compila, testa, gera o instalador
# com o Velopack e publica a Release. O Vapt instalado vê a versão nova sozinho e se atualiza.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Velopack
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Instalador (testes, build autocontido e pacote delta)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/pack.ps1 -Version ($env:GITHUB_REF_NAME -replace '^v', '') -SkipSmoke -Delta

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = $env:GITHUB_REF_NAME -replace '^v', ''
          $dir = 'artifacts/releases'
          $files = @(
            "$dir/Vapt.App-win-Setup.exe", "$dir/Vapt.App-win.msi", "$dir/Vapt.App-win-Portable.zip",
            "$dir/releases.win.json", "$dir/RELEASES", "$dir/assets.win.json"
          ) + @(Get-ChildItem $dir -Filter "Vapt.App-$v-*.nupkg" | ForEach-Object FullName)
          $notes = if (Test-Path "docs/notas/$env:GITHUB_REF_NAME.md") { "docs/notas/$env:GITHUB_REF_NAME.md" } else { $null }
          if ($notes) {
            gh release create $env:GITHUB_REF_NAME @files --title "Vapt $v" --notes-file $notes --latest
          } else {
            gh release create $env:GITHUB_REF_NAME @files --title "Vapt $v" --generate-notes --latest
          }
